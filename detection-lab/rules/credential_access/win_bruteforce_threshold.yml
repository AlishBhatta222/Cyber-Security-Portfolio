title: Windows Failed Logon Base Event
name: win_failed_logon_4625
status: experimental
description: Base detection for a single failed Windows network logon.
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
        LogonType: 3
    condition: selection
---
title: SMB Brute Force (Multiple Failed Logons From One Source)
id: 2b7f1e9a-4c3d-4a5e-9f8b-0c1d2e3f4a5b
status: experimental
description: Detects five or more failed network logons from the same source IP within five minutes, indicating an SMB brute force attempt.
references:
    - https://attack.mitre.org/techniques/T1110/
author: Alish Bhatta (cyberwithalish)
date: 2026-07-05
tags:
    - attack.credential_access
    - attack.t1110
correlation:
    type: event_count
    rules:
        - win_failed_logon_4625
    group-by:
        - IpAddress
    timespan: 5m
    condition:
        gte: 5
level: high
