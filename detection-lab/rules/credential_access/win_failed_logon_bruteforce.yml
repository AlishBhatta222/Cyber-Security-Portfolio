title: Windows Failed Logon (Possible Brute Force)
id: 6f3a1b2c-8d4e-4f5a-b6c7-1e2d3f4a5b60
status: experimental
description: Detects failed Windows network logon attempts. A high volume from a single source can indicate an SMB brute force attack.
references:
    - https://attack.mitre.org/techniques/T1110/
author: Alish Bhatta (cyberwithalish)
date: 2026-07-05
tags:
    - attack.credential_access
    - attack.t1110
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
        LogonType: 3
    condition: selection
falsepositives:
    - Users mistyping their password
    - Service accounts with expired credentials
level: medium
